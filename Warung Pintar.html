<style>
/* Layout: sidebar menu di kiri untuk desktop, menu geser di atas untuk ponsel. Konten satu kolom berisi panel bertumpuk. */
:root{

  --accent:#1D3F8F; --accent-ink:#FFFFFF; --accent-soft:#E2E9F8;

  --good:#1B7A4B; --good-soft:#DDF1E6; --warn:#8F5A00; --warn-soft:#FAEED0; --bad:#B0302A; --bad-soft:#F8E0DD;
  --paper:#FBFAF5; --paper-ink:#23211C;
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;

}
@media (prefers-color-scheme: dark){

    --bg:#0F1513; --surface:#18211D; --surface2:#1E2924; --ink:#E6EDE9; --muted:#93A29B; --line:#2B3833;
    --accent:#8FB0FF; --accent-ink:#0B1530; --accent-soft:#1F2C4D;
    --c-buy:#E8B04A;
    --good:#5FD08E; --good-soft:#17382A; --warn:#E8B04A; --warn-soft:#3A2E12; --bad:#F28C82; --bad-soft:#3E1C19;
    --paper:#DAD8CE; --paper-ink:#1D1C18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211D; --surface2:#1E2924; --ink:#E6EDE9; --muted:#93A29B; --line:#2B3833;
  --accent:#8FB0FF; --accent-ink:#0B1530; --accent-soft:#1F2C4D;
  --c-buy:#E8B04A;
  --good:#5FD08E; --good-soft:#17382A; --warn:#E8B04A; --warn-soft:#3A2E12; --bad:#F28C82; --bad-soft:#3E1C19;
  --paper:#DAD8CE; --paper-ink:#1D1C18;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.shell{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;max-width:1160px;margin:0 auto}
.side{position:sticky;top:16px;align-self:start;display:flex;flex-direction:column;gap:20px;min-width:0}
.brand b{display:block;font:700 22px/1.1 var(--f-display);letter-spacing:-.01em}
.brand span{display:block;font:400 11px var(--f-mono);color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.08em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;padding:9px 12px;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted);font:500 14px var(--f-body);cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.badge{font:500 11px var(--f-mono);background:var(--bad-soft);color:var(--bad);padding:1px 7px;border-radius:99px}
@media (max-width:820px){

}

main{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}

.scroll{overflow-x:auto}

th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:13px}
tfoot td{font-weight:600;border-top:2px solid var(--line)}
.zero{color:var(--muted)}
tr.det td{background:var(--surface2)}
.pill{display:inline-block;font:500 12px var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.jual{background:var(--accent-soft);color:var(--accent)}
.pill.beli{background:var(--warn-soft);color:var(--warn)}

.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.split,.two{grid-template-columns:minmax(0,1fr)}#cartpanel{order:-1}}

#chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:400 11px var(--f-mono)}
.b1{fill:var(--accent)}.b2{fill:var(--c-buy)}

.tp{display:grid;gap:5px;padding:9px 0;border-bottom:1px solid var(--line)}
.tp:last-child{border-bottom:0}
.tp .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.tp .bar i{display:block;height:100%;background:var(--accent)}
.lowrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lowrow:last-of-type{border-bottom:0}

.plist{display:flex;flex-direction:column;max-height:440px;overflow:auto;margin-top:10px;border:1px solid var(--line);border-radius:10px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1px 12px;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;width:100%}
.prow:last-child{border-bottom:0}
.prow:hover:not(:disabled){background:var(--surface2)}
.prow:disabled{opacity:.5;cursor:not-allowed}
.prow .n{font-weight:500}
.prow .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.prow .s{font-size:12px;color:var(--muted)}
.prow .s.r{text-align:right}
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.crow .n{font-weight:500}
.crow .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty input{width:56px;text-align:center;padding:4px;min-height:30px}
.qty .btn{min-width:30px}
.sum{margin:12px 0 4px;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.cartbox{display:flex;flex-direction:column;gap:2px}

.struk{background:var(--paper);color:var(--paper-ink);font:400 13px/1.5 var(--f-mono);padding:16px;border-radius:6px;margin:12px 0}
.struk .ln{gap:12px}
.struk hr{border:0;border-top:1px dashed currentColor;opacity:.5;margin:8px 0}
.struk .c{text-align:center}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tools .in{flex:1 1 160px;width:auto}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.formact{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.minitbl{margin-top:14px}

pre{margin:0;padding:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;overflow:auto;font:400 12.5px/1.55 var(--f-mono);white-space:pre}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.tcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}
.tcard h3{margin:0;padding:8px 12px;background:var(--surface2);font:500 13px var(--f-mono);border-bottom:1px solid var(--line)}
.tcard ul{list-style:none;margin:0;padding:6px 12px 8px;font-size:13px}
.tcard li{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.tcard li span:last-child{color:var(--muted);font-family:var(--f-mono);font-size:12px;text-align:right}
.codehead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0 6px}
.codehead b{font-weight:600}
.rules{margin:8px 0 0;padding-left:20px;max-width:70ch}
.rules li{margin:4px 0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100vw - 32px);z-index:20}
</style>

<div class="shell">
  <aside class="side">
    <div class="brand"><b>Warung Pintar</b><span>kasir · gudang · rekap</span></div>
    <nav class="nav" id="nav" aria-label="Menu utama"></nav>
  </aside>
  <main id="app"></main>

<script>
(function(){
'use strict';

/* ---------- util ---------- */
var KEY='warung-pintar-v1';
var MONTHS=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var MON=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
function pad(n,l){return String(n).padStart(l||2,'0')}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return ymd(d)}
var TODAY=ymd(new Date());
function num(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function rp(n){return (n<0?'-Rp ':'Rp ')+num(Math.abs(n))}
function short(n){var a=Math.abs(n);
  if(a>=1e9)return (n/1e9).toFixed(1).replace(/\.0$/,'').replace('.',',')+' M';
  if(a>=1e6)return (n/1e6).toFixed(1).replace(/\.0$/,'').replace('.',',')+' jt';
  if(a>=1e3)return Math.round(n/1e3)+' rb';
  return String(Math.round(n))}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtDate(s){var d=parse(s);return DAYS[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function fmtShort(s){var d=parse(s);return d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function niceStep(x){var p=Math.pow(10,Math.floor(Math.log10(x)));var f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function itemsText(items){var t=items.slice(0,3).map(function(i){return i.name+' ×'+i.qty}).join(', ');return t+(items.length>3?' +'+(items.length-3)+' lainnya':'')}

/* ---------- data contoh ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function seed(){
  var P=[
    ['BRS-001','Beras Premium 5 kg','Sembako','pak',62000,69000,10,6],
    ['MYK-001','Minyak Goreng 1 L','Sembako','botol',15500,18000,24,9],
    ['GLA-001','Gula Pasir 1 kg','Sembako','pak',14500,17000,20,7],
    ['TLR-001','Telur Ayam 1 kg','Sembako','kg',26000,30000,10,8],
    ['MIE-001','Mi Instan Goreng','Makanan','bungkus',2800,3500,60,16],
    ['BSK-001','Biskuit Kelapa','Makanan','bungkus',6200,8500,20,5],
    ['KPI-001','Kopi Sachet','Minuman','sachet',1200,2000,100,12],
    ['TEH-001','Teh Celup 25 pcs','Minuman','kotak',5500,7500,20,5],
    ['AQU-001','Air Mineral 600 ml','Minuman','botol',2300,3500,48,13],
    ['SUS-001','Susu UHT 250 ml','Minuman','kotak',4800,6500,24,6],
    ['KCP-001','Kecap Manis 275 ml','Bumbu','botol',9500,12500,12,4],
    ['GRM-001','Garam Dapur 250 g','Bumbu','bungkus',2200,3500,20,3],
    ['SBN-001','Sabun Mandi Batang','Kebersihan','pcs',3200,4500,30,5],
    ['SMP-001','Sampo Sachet','Kebersihan','sachet',450,1000,100,6],
    ['DTR-001','Deterjen 800 g','Kebersihan','bungkus',15500,19000,12,4],
    ['PST-001','Pasta Gigi 75 g','Kebersihan','pcs',8800,11500,12,3],
    ['TSU-001','Tisu Wajah 250 lembar','Kebersihan','pak',9800,13000,12,3],
    ['GAS-001','Gas Elpiji 3 kg','Lainnya','tabung',18000,22000,6,3],
    ['BTR-001','Baterai AA','Lainnya','pak',7500,10000,10,2]
  ];
  var SUP={Sembako:'UD Sumber Pangan',Makanan:'CV Maju Pangan',Minuman:'PT Segar Niaga',Bumbu:'UD Sumber Pangan',Kebersihan:'CV Bersih Sejahtera',Lainnya:'Toko Grosir Mitra'};
  var products=P.map(function(p,i){return {id:i+1,sku:p[0],name:p[1],cat:p[2],unit:p[3],buy:p[4],sell:p[5],min:p[6],stock:p[6]*4}});
  var W=P.map(function(p){return p[7]});
  var cost={},stock={};
  products.forEach(function(p){cost[p.id]=Math.round(p.buy*0.94/50)*50;stock[p.id]=p.min*4});
  var cum=[],acc=0;W.forEach(function(w){acc+=w;cum.push(acc)});
  var r=rng(20261019);
  function pick(){var x=r()*acc;for(var i=0;i<cum.length;i++)if(x<cum[i])return i;return cum.length-1}
  var DAYSN=400,start=addDays(TODAY,-DAYSN),sales=[],purchases=[];
  for(var i=0;i<=DAYSN;i++){
    var date=addDays(start,i),dow=parse(date).getDay();
    if(dow===3&&i>0){
      var groups={};
      products.forEach(function(p){
        if(stock[p.id]<p.min*2.5&&!(i>DAYSN-18&&(p.sku==='BRS-001'||p.sku==='TLR-001'||p.sku==='MYK-001'))){
          var c=Math.round(p.buy*(0.94+0.06*i/DAYSN)/50)*50;
          (groups[SUP[p.cat]]=groups[SUP[p.cat]]||[]).push({pid:p.id,name:p.name,qty:p.min*4-stock[p.id],cost:c});
        }
      });
      Object.keys(groups).forEach(function(sup){
        var items=groups[sup],total=0;
        items.forEach(function(it){stock[it.pid]+=it.qty;cost[it.pid]=it.cost;total+=it.qty*it.cost});
        purchases.push({date:date,supplier:sup,items:items,total:total});
      });
    }
    var base=3+Math.floor(i/100)+((dow===0||dow===6)?2:0);
    var n=base+Math.floor(r()*4);
    for(var k=0;k<n;k++){
      var cnt=1+Math.floor(r()*4),items2=[],used={};
      for(var j=0;j<cnt;j++){
        var idx=pick(),p=products[idx];
        if(used[p.id])continue;
        var maxQ=p.sell<5000?6:p.sell<20000?3:2,q=1+Math.floor(r()*maxQ);
        if(stock[p.id]<q)continue;
        used[p.id]=1;stock[p.id]-=q;
        items2.push({pid:p.id,name:p.name,qty:q,price:p.sell,cost:cost[p.id]});
      }
      if(!items2.length)continue;
      var total2=items2.reduce(function(t,it){return t+it.qty*it.price},0);
      var paid=Math.ceil(total2/5000)*5000+(r()<0.3?5000:0);
      var time=pad(7+Math.floor(r()*14))+':'+pad(Math.floor(r()*60));
      sales.push({date:date,time:time,items:items2,total:total2,paid:paid});
    }
  }
  sales.sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:a.time<b.time?-1:a.time>b.time?1:0});
  var c1={};
  sales.forEach(function(s){var key=s.date;c1[key]=(c1[key]||0)+1;s.no='PJ-'+s.date.replace(/-/g,'')+'-'+pad(c1[key],3);s.id=s.no});
  var c2={};
  purchases.forEach(function(b){var key=b.date;c2[key]=(c2[key]||0)+1;b.no='PB-'+b.date.replace(/-/g,'')+'-'+pad(c2[key],3);b.id=b.no});
  products.forEach(function(p){p.stock=stock[p.id];p.buy=cost[p.id]});
  return {products:products,sales:sales,purchases:purchases};
}

function persist(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
function load(){
  try{var t=localStorage.getItem(KEY);if(t){var d=JSON.parse(t);if(d&&d.products&&d.sales&&d.purchases)return d}}catch(e){}
  var d2=seed();persist(d2);return d2;
}

/* ---------- agregasi ---------- */
function buildAgg(){
  var m={};
  function g(d){return m[d]||(m[d]={sales:0,buys:0,profit:0,tx:0,units:0})}
  DB.sales.forEach(function(s){var a=g(s.date);a.tx++;a.sales+=s.total;s.items.forEach(function(it){a.units+=it.qty;a.profit+=it.qty*(it.price-it.cost)})});
  DB.purchases.forEach(function(b){g(b.date).buys+=b.total});
  return m;
}
function agg(){if(!AGG)AGG=buildAgg();return AGG}
function statsR(a,b){
  var o={sales:0,buys:0,profit:0,tx:0,units:0},A=agg();
  for(var k in A){if(k>=a&&k<=b){var r=A[k];o.sales+=r.sales;o.buys+=r.buys;o.profit+=r.profit;o.tx+=r.tx;o.units+=r.units}}
  return o;
}
function curKey(){return S.mode==='harian'?S.d:S.mode==='bulanan'?S.m:S.y}
function rangeOf(mode,v){
  if(mode==='harian')return [v,v];
  var end;
  if(mode==='bulanan'){var a=v.split('-').map(Number);end=v+'-'+pad(new Date(a[0],a[1],0).getDate());if(end>TODAY)end=TODAY;return [v+'-01',end]}
  end=v+'-12-31';if(end>TODAY)end=TODAY;return [v+'-01-01',end];
}
function prevRange(mode,v){
  var rg=rangeOf(mode,v),b=rg[1];
  if(mode==='harian'){var p=addDays(v,-1);return [p,p,'kemarin']}
  if(mode==='bulanan'){
    var a=v.split('-').map(Number),y=a[0],m=a[1]-1;if(m<1){m=12;y--}
    var pm=y+'-'+pad(m),dim=new Date(y,m,0).getDate(),day=Math.min(Number(b.slice(8)),dim);
    return [pm+'-01',pm+'-'+pad(day),'bulan lalu'+(v===TODAY.slice(0,7)?' (tanggal sama)':'')];
  }
  var py=String(Number(v)-1);
  return [py+'-01-01',py+b.slice(4),'tahun lalu'+(v===TODAY.slice(0,4)?' (periode sama)':'')];
}
function periodLabel(){
  if(S.mode==='harian')return fmtDate(S.d);
  if(S.mode==='bulanan'){var a=S.m.split('-');return MONTHS[Number(a[1])-1]+' '+a[0]}
  return S.y;
}
function years(){
  var cy=Number(TODAY.slice(0,4)),min=cy;
  DB.sales.forEach(function(s){var y=Number(s.date.slice(0,4));if(y<min)min=y});
  DB.purchases.forEach(function(s){var y=Number(s.date.slice(0,4));if(y<min)min=y});
  var out=[];for(var y=cy;y>=min;y--)out.push(String(y));return out;
}
function series(){
  var A=agg(),out=[];
  function g(k){return A[k]||{sales:0,buys:0}}
  if(S.mode==='harian'){
    for(var i=-13;i<=0;i++){var k=addDays(S.d,i);out.push({lab:String(parse(k).getDate()),full:fmtDate(k),sales:g(k).sales,buys:g(k).buys})}
  }else if(S.mode==='bulanan'){
    var n=Number(rangeOf('bulanan',S.m)[1].slice(8));
    for(var d=1;d<=n;d++){var k2=S.m+'-'+pad(d);out.push({lab:String(d),full:fmtDate(k2),sales:g(k2).sales,buys:g(k2).buys})}
  }else{
    var nm=Number(rangeOf('tahunan',S.y)[1].slice(5,7));
    for(var m=1;m<=nm;m++){
      var pre=S.y+'-'+pad(m),s=0,b=0;
      for(var kk in A)if(kk.indexOf(pre)===0){s+=A[kk].sales;b+=A[kk].buys}
      out.push({lab:MON[m-1],full:MONTHS[m-1]+' '+S.y,sales:s,buys:b});
    }
  }
  return out;
}
function topProducts(a,b){
  var m={};
  DB.sales.forEach(function(s){
    if(s.date<a||s.date>b)return;
    s.items.forEach(function(it){var o=m[it.pid]||(m[it.pid]={name:it.name,qty:0,rev:0,profit:0});o.qty+=it.qty;o.rev+=it.qty*it.price;o.profit+=it.qty*(it.price-it.cost)});
  });
  return Object.keys(m).map(function(k){return m[k]}).sort(function(x,y){return y.rev-x.rev}).slice(0,6);
}

function drawChart(){
  var el=document.getElementById('chart');if(!el)return;

  var W=Math.max(280,el.clientWidth),H=W<520?220:270,L=46,R=6,T=10,B=24;
  var max=Math.max(1000,Math.max.apply(null,data.map(function(d){return Math.max(d.sales,d.buys)})));
  var step=niceStep(max/4),nt=Math.ceil(max/step),top=step*nt;
  var iw=W-L-R,ih=H-T-B,gw=iw/data.length,bw=Math.max(2,Math.min(16,gw*0.4));
  var skip=Math.ceil(data.length/Math.max(1,Math.floor(iw/36)));

  for(var k=0;k<=nt;k++){var v=k*step,y=T+ih-v/top*ih;s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+short(v)+'</text>'}
  data.forEach(function(d,i){
    var cx=L+gw*i+gw/2,h1=d.sales/top*ih,h2=d.buys/top*ih;

      '<rect class="b1" x="'+(cx-bw-0.5)+'" y="'+(T+ih-h1)+'" width="'+bw+'" height="'+h1+'" rx="1.5"/>'+
      '<rect class="b2" x="'+(cx+0.5)+'" y="'+(T+ih-h2)+'" width="'+bw+'" height="'+h2+'" rx="1.5"/>';
    if(i%skip===0)s+='<text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+d.lab+'</text>';
    s+='</g>';
  });

}

function nextNo(pre,list,date){
  var base=pre+'-'+date.replace(/-/g,'')+'-',mx=0;
  list.forEach(function(x){if(x.no.indexOf(base)===0){var n=parseInt(x.no.slice(base.length),10);if(n>mx)mx=n}});
  return base+pad(mx+1,3);
}
function saveSale(){
  var items=S.cart.filter(function(c){return prod(c.pid)});
  if(!items.length){toast('Keranjang masih kosong');return}
  if(!S.sdate){toast('Isi tanggal transaksi');return}
  for(var i=0;i<items.length;i++){var p=prod(items[i].pid);if(items[i].qty>p.stock){toast('Stok '+p.name+' tinggal '+p.stock);return}}
  var total=cartTotal(),paid=Number(S.paid);
  if(!(paid>=total)){toast('Uang diterima kurang dari total');return}
  var now=new Date(),time=pad(now.getHours())+':'+pad(now.getMinutes()),no=nextNo('PJ',DB.sales,S.sdate);
  var sale={id:no,no:no,date:S.sdate,time:time,total:total,paid:paid,items:items.map(function(c){var p=prod(c.pid);return {pid:p.id,name:p.name,qty:c.qty,price:p.sell,cost:p.buy}})};
  items.forEach(function(c){prod(c.pid).stock-=c.qty});
  DB.sales.push(sale);save();S.cart=[];S.paid='';S.receipt=no;render();toast('Penjualan '+no+' tersimpan');
}

function saveProduct(){
  var g=function(id){return document.getElementById(id).value};
  var sku=g('f_sku').trim(),name=g('f_name').trim(),cat=g('f_cat').trim()||'Lainnya',unit=g('f_unit').trim()||'pcs';
  var buy=parseFloat(g('f_buy')),sell=parseFloat(g('f_sell')),stock=parseInt(g('f_stock'),10),min=parseInt(g('f_min'),10);
  if(!name){toast('Isi nama produk');return}
  if(!sku){toast('Isi SKU');return}
  if(DB.products.some(function(p){return p.sku.toLowerCase()===sku.toLowerCase()&&p.id!==S.edit})){toast('SKU sudah dipakai produk lain');return}
  if(!(buy>=0)||!(sell>=0)){toast('Isi harga beli dan harga jual');return}
  if(!(stock>=0)||!(min>=0)){toast('Stok dan stok minimum harus berupa angka 0 atau lebih');return}
  if(S.edit==='new'){var id=DB.products.reduce(function(m,p){return Math.max(m,p.id)},0)+1;DB.products.push({id:id,sku:sku,name:name,cat:cat,unit:unit,buy:buy,sell:sell,stock:stock,min:min})}
  else{Object.assign(prod(S.edit),{sku:sku,name:name,cat:cat,unit:unit,buy:buy,sell:sell,stock:stock,min:min})}
  save();S.edit=null;render();toast(sell<buy?'Tersimpan. Harga jual di bawah harga beli.':'Produk tersimpan');
}

/* ---------- tampilan: skema ---------- */
function viewSkema(){
  var y=Number(TODAY.slice(0,4)),m=Number(TODAY.slice(5,7));
  var ym=TODAY.slice(0,7),nm=m===12?(y+1)+'-01-01':y+'-'+pad(m+1)+'-01';
  var tables=[
    ['products',[['id','PK'],['sku','UNIQUE'],['name','varchar'],['category','varchar'],['unit','varchar'],['buy_price','decimal'],['sell_price','decimal'],['stock','int'],['min_stock','int']]],
    ['sales',[['id','PK'],['invoice_no','UNIQUE'],['sold_at','datetime, index'],['total','decimal'],['paid','decimal']]],
    ['sale_items',[['id','PK'],['sale_id','FK sales'],['product_id','FK products'],['qty','int'],['price','decimal'],['cost','decimal']]],
    ['purchases',[['id','PK'],['purchase_no','UNIQUE'],['purchased_at','date, index'],['supplier','varchar'],['total','decimal']]],
    ['purchase_items',[['id','PK'],['purchase_id','FK purchases'],['product_id','FK products'],['qty','int'],['cost','decimal']]]
  ];
  var ddl=[
"CREATE TABLE products (",
"  id INT UNSIGNED AUTO_INCREMENT PRIMARY KEY,",
"  sku VARCHAR(30) NOT NULL UNIQUE,",
"  name VARCHAR(120) NOT NULL,",
"  category VARCHAR(60),",
"  unit VARCHAR(20) NOT NULL DEFAULT 'pcs',",
"  buy_price DECIMAL(12,2) NOT NULL DEFAULT 0,",
"  sell_price DECIMAL(12,2) NOT NULL DEFAULT 0,",
"  stock INT NOT NULL DEFAULT 0,",
"  min_stock INT NOT NULL DEFAULT 0",
");",
"",
"CREATE TABLE sales (",
"  id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,",
"  invoice_no VARCHAR(30) NOT NULL UNIQUE,",
"  sold_at DATETIME NOT NULL,",
"  total DECIMAL(14,2) NOT NULL,",
"  paid DECIMAL(14,2) NOT NULL,",
"  INDEX idx_sold_at (sold_at)",
");",
"",
"CREATE TABLE sale_items (",
"  id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,",
"  sale_id BIGINT UNSIGNED NOT NULL,",
"  product_id INT UNSIGNED NOT NULL,",
"  qty INT NOT NULL,",
"  price DECIMAL(12,2) NOT NULL,",
"  cost DECIMAL(12,2) NOT NULL,",
"  FOREIGN KEY (sale_id) REFERENCES sales(id) ON DELETE CASCADE,",
"  FOREIGN KEY (product_id) REFERENCES products(id)",
");",
"",
"CREATE TABLE purchases (",
"  id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,",
"  purchase_no VARCHAR(30) NOT NULL UNIQUE,",
"  purchased_at DATE NOT NULL,",
"  supplier VARCHAR(120) NOT NULL,",
"  total DECIMAL(14,2) NOT NULL,",
"  INDEX idx_purchased_at (purchased_at)",
");",
"",
"CREATE TABLE purchase_items (",
"  id BIGINT UNSIGNED AUTO_INCREMENT PRIMARY KEY,",
"  purchase_id BIGINT UNSIGNED NOT NULL,",
"  product_id INT UNSIGNED NOT NULL,",
"  qty INT NOT NULL,",
"  cost DECIMAL(12,2) NOT NULL,",
"  FOREIGN KEY (purchase_id) REFERENCES purchases(id) ON DELETE CASCADE,",
"  FOREIGN KEY (product_id) REFERENCES products(id)",
");"].join('\n');
  var q=[
    ['q_harian','Rekap harian',
"SELECT DATE(sold_at) AS tanggal,\n       COUNT(*)       AS transaksi,\n       SUM(total)     AS penjualan\nFROM sales\nWHERE sold_at >= '"+TODAY+"' AND sold_at < '"+addDays(TODAY,1)+"'\nGROUP BY DATE(sold_at);"],
    ['q_bulanan','Rekap bulanan (per tanggal)',
"SELECT DATE(sold_at) AS tanggal,\n       COUNT(*)       AS transaksi,\n       SUM(total)     AS penjualan\nFROM sales\nWHERE sold_at >= '"+ym+"-01' AND sold_at < '"+nm+"'\nGROUP BY DATE(sold_at)\nORDER BY tanggal;"],
    ['q_tahunan','Rekap tahunan (per bulan)',
"SELECT MONTH(sold_at) AS bulan,\n       COUNT(*)        AS transaksi,\n       SUM(total)      AS penjualan\nFROM sales\nWHERE sold_at >= '"+y+"-01-01' AND sold_at < '"+(y+1)+"-01-01'\nGROUP BY MONTH(sold_at)\nORDER BY bulan;"],
    ['q_laba','Laba kotor per bulan',
"SELECT DATE_FORMAT(s.sold_at, '%Y-%m') AS bulan,\n       SUM(si.qty * si.price)            AS penjualan,\n       SUM(si.qty * (si.price - si.cost)) AS laba_kotor\nFROM sales s\nJOIN sale_items si ON si.sale_id = s.id\nGROUP BY bulan\nORDER BY bulan;"],
    ['q_stok','Stok menipis',
"SELECT sku, name, stock, min_stock\nFROM products\nWHERE stock <= min_stock\nORDER BY stock / NULLIF(min_stock, 0);"],
    ['q_jual','Simpan penjualan (satu transaksi database)',
"START TRANSACTION;\n\nINSERT INTO sales (invoice_no, sold_at, total, paid)\nVALUES ('PJ-"+TODAY.replace(/-/g,'')+"-001', NOW(), 36000, 50000);\n\nINSERT INTO sale_items (sale_id, product_id, qty, price, cost)\nVALUES (LAST_INSERT_ID(), 5, 3, 3500, 2800);\n\nUPDATE products\nSET stock = stock - 3\nWHERE id = 5 AND stock >= 3;\n-- Jika baris terpengaruh = 0, stok kurang. Jalankan ROLLBACK.\n\nCOMMIT;"]
  ];
  return '<div class="stack">'+head('Skema data','Struktur tabel dan query yang dipakai aplikasi ini. Bisa dijadikan acuan saat membuat versi sungguhan dengan database.')+
    '<section class="panel"><h2>Tabel</h2><p class="sub">Satu transaksi punya banyak baris item. Produk dihubungkan lewat product_id.</p><div class="cols">'+

    '<div class="codehead"><b>CREATE TABLE (MySQL)</b><button class="btn sm" data-act="copy" data-k="ddl">Salin</button></div><pre id="ddl">'+esc(ddl)+'</pre></section>'+
    '<section class="panel"><h2>Query rekap</h2><p class="sub">Tanggal pada contoh mengikuti hari ini. Filter memakai rentang tanggal agar index pada kolom tanggal ikut terpakai.</p>'+
    q.map(function(x){return '<div class="codehead"><b>'+x[1]+'</b><button class="btn sm" data-act="copy" data-k="'+x[0]+'">Salin</button></div><pre id="'+x[0]+'">'+esc(x[2])+'</pre>'}).join('')+'</section>'+
    '<section class="panel"><h2>Aturan yang dipakai di aplikasi ini</h2><ul class="rules">'+
    '<li>Harga jual dan harga beli disalin ke tabel item saat transaksi. Laba bulan lalu tidak berubah ketika harga produk diubah.</li>'+
    '<li>Stok dikurangi di dalam satu transaksi database dengan syarat stok cukup, supaya dua kasir tidak menjual barang yang sama sekaligus.</li>'+
    '<li>Pembatalan membalik stok. Pembatalan pembelian ditolak jika stok hasil pembelian itu sudah terpakai.</li>'+
    '<li>Rekap harian, bulanan, dan tahunan memakai query yang sama dengan pengelompokan berbeda. Tidak perlu tabel rekap terpisah selama data masih ribuan baris.</li>'+
    '<li>Untuk audit stok, tambahkan tabel stock_movements berisi product_id, jenis (masuk, keluar, koreksi), jumlah, dan referensi transaksi.</li></ul></section>'+
    foot()+'</div>';
}
function copyText(id){
  var el=document.getElementById(id);if(!el)return;
  var t=el.textContent;
  function fb(){var r=document.createRange();r.selectNodeContents(el);var s=window.getSelection();s.removeAllRanges();s.addRange(r);toast('Teks dipilih, tekan salin')}
  try{navigator.clipboard.writeText(t).then(function(){toast('Disalin')},fb)}catch(e){fb()}
}

/* ---------- render ---------- */
var TABS=[['rekap','Rekap'],['jual','Penjualan'],['beli','Pembelian'],['stok','Inventori'],['skema','Skema data']];
function renderNav(){
  var low=lowCount();
  document.getElementById('nav').innerHTML=TABS.map(function(t){
    return '<button data-act="tab" data-k="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':'')+'>'+t[1]+(t[0]==='stok'&&low?'<span class="badge" title="Produk menipis atau habis">'+low+'</span>':'')+'</button>';
  }).join('');
}
function render(){
  renderNav();
  var v={rekap:viewRekap,jual:viewJual,beli:viewBeli,stok:viewStok,skema:viewSkema}[S.tab];
  document.getElementById('app').innerHTML=v();
  if(S.tab==='rekap')drawChart();
  if(S.tab==='jual')updatePay();
}

/* ---------- aksi ---------- */
var ACT={
  tab:function(el,o){S.tab=o.k;S.confirm=null;render();window.scrollTo(0,0)},
  mode:function(el,o){S.mode=o.k;render()},
  shift:function(el,o){shift(Number(o.k))},
  drill:function(el,o){if(S.mode==='bulanan'){S.mode='harian';S.d=o.k}else{S.mode='bulanan';S.m=o.k}render();window.scrollTo(0,0)},
  add:function(el,o){
    var p=prod(o.id);if(!p)return;
    var c=S.cart.find(function(x){return x.pid===p.id}),q=c?c.qty:0;
    if(q+1>p.stock){toast('Stok '+p.name+' hanya '+p.stock);return}
    if(c)c.qty++;else S.cart.push({pid:p.id,qty:1});
    S.receipt=null;renderCart();toast('Ditambahkan: '+p.name);
  },
  inc:function(el,o){
    var p=prod(o.id),c=S.cart.find(function(x){return x.pid===o.id});if(!p||!c)return;
    if(c.qty+1>p.stock){toast('Stok '+p.name+' hanya '+p.stock);return}
    c.qty++;renderCart();
  },
  dec:function(el,o){
    var c=S.cart.find(function(x){return x.pid===o.id});if(!c)return;
    c.qty--;if(c.qty<1)S.cart=S.cart.filter(function(x){return x!==c});renderCart();
  },
  rm:function(el,o){S.cart=S.cart.filter(function(x){return x.pid!==o.id});renderCart()},
  paid:function(el,o){S.paid=String(o.k==='pas'?cartTotal():Number(o.k));renderCart()},
  savesale:function(){saveSale()},
  newsale:function(){S.receipt=null;renderCart()},
  open:function(el,o){S.open=S.open===o.k?null:o.k;render()},
  delsale:function(el,o){
    confirmable('s'+o.k,function(){
      var s=DB.sales.find(function(x){return x.id===o.k});if(!s)return;
      s.items.forEach(function(it){var p=prod(it.pid);if(p)p.stock+=it.qty});
      DB.sales=DB.sales.filter(function(x){return x!==s});
      if(S.receipt===s.id)S.receipt=null;if(S.open===s.id)S.open=null;
      save();render();toast('Penjualan dibatalkan, stok dikembalikan');
    });
  },
  delpur:function(el,o){
    confirmable('b'+o.k,function(){
      var b=DB.purchases.find(function(x){return x.id===o.k});if(!b)return;
      for(var i=0;i<b.items.length;i++){var p=prod(b.items[i].pid);if(p&&p.stock<b.items[i].qty){render();toast('Tidak bisa dibatalkan: stok '+p.name+' sudah terpakai');return}}
      b.items.forEach(function(it){var p=prod(it.pid);if(p)p.stock-=it.qty});
      DB.purchases=DB.purchases.filter(function(x){return x!==b});
      if(S.open===b.id)S.open=null;
      save();render();toast('Pembelian dibatalkan, stok dikurangi');
    });
  },
  padd:function(){
    var p=prod(Number(S.psel)),qty=parseInt(S.pq,10),cost=parseFloat(S.pc);
    if(!p){toast('Pilih produk dulu');return}
    if(!(qty>0)){toast('Jumlah harus lebih dari 0');return}
    if(S.pc===''||!(cost>=0)){toast('Isi harga beli');return}
    var d=S.pdraft.find(function(x){return x.pid===p.id});
    if(d){d.qty+=qty;d.cost=cost}else S.pdraft.push({pid:p.id,qty:qty,cost:cost});
    S.psel='';S.pq='1';S.pc='';render();
  },
  prm:function(el,o){S.pdraft.splice(o.id,1);render()},
  psave:function(){
    var sup=S.psup.trim();
    if(!S.pdraft.length){toast('Daftar pembelian masih kosong');return}
    if(!sup){toast('Isi nama pemasok');return}
    if(!S.pdate){toast('Isi tanggal pembelian');return}
    var items=S.pdraft.filter(function(d){return prod(d.pid)}).map(function(d){var p=prod(d.pid);return {pid:p.id,name:p.name,qty:d.qty,cost:d.cost}});
    var no=nextNo('PB',DB.purchases,S.pdate),total=items.reduce(function(t,i){return t+i.qty*i.cost},0);
    items.forEach(function(i){var p=prod(i.pid);p.stock+=i.qty;p.buy=i.cost});
    DB.purchases.push({id:no,no:no,date:S.pdate,supplier:sup,items:items,total:total});
    save();S.pdraft=[];S.psup='';render();toast('Pembelian '+no+' tersimpan, stok bertambah');
  },
  inew:function(){S.edit='new';render();focusForm()},
  iedit:function(el,o){S.edit=o.id;render();focusForm()},
  icancel:function(){S.edit=null;render()},
  isave:function(){saveProduct()},
  idel:function(el,o){
    confirmable('p'+o.id,function(){
      DB.products=DB.products.filter(function(p){return p.id!==o.id});
      S.cart=S.cart.filter(function(c){return c.pid!==o.id});
      S.pdraft=S.pdraft.filter(function(c){return c.pid!==o.id});
      if(S.edit===o.id)S.edit=null;
      save();render();toast('Produk dihapus. Riwayat transaksi tetap tersimpan.');
    });
  },
  copy:function(el,o){copyText(o.k)},
  reset:function(){
    confirmable('reset',function(){DB=seed();persist(DB);AGG=null;resetState();render();toast('Data contoh dikembalikan')});
  }
};
function focusForm(){setTimeout(function(){var f=document.getElementById('iform');if(f)f.scrollIntoView({block:'start'})},0)}

document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var o={id:Number(el.dataset.id),k:el.dataset.k,ck:el.dataset.ck},fn=ACT[el.dataset.act];
  if(S.confirm&&S.confirm!==o.ck){S.confirm=null;render()}
  if(fn)fn(el,o);
});
function onBind(t){
  var b=t.dataset.bind;if(!b)return;
  S[b]=t.value;
  if(b==='sq'){var pl=document.getElementById('plist');if(pl)pl.innerHTML=plistHTML()}
  else if(b==='paid')updatePay();
  else if(b==='iq'||b==='icat'||b==='ist'){var it=document.getElementById('itable');if(it)it.innerHTML=itableHTML()}
  else if(b==='psel'){var p=prod(Number(t.value));S.pc=p?String(p.buy):'';var pc=document.getElementById('pc');if(pc)pc.value=S.pc}
}
document.addEventListener('input',function(e){var t=e.target;if(t.dataset.qty||t.dataset.rk)return;onBind(t)});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset.qty){
    var id=Number(t.dataset.qty),p=prod(id),c=S.cart.find(function(x){return x.pid===id});
    if(p&&c){var q=parseInt(t.value,10);if(!(q>=1))q=1;if(q>p.stock){q=p.stock;toast('Stok '+p.name+' hanya '+p.stock)}c.qty=q;renderCart()}
    return;
  }
  if(t.dataset.rk){applyPeriod();return}
  onBind(t);
});
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(S.tab==='rekap')drawChart()},150)});

render();
})();
</script>

</body></html>
